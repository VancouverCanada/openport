openapi: 3.1.0
info:
  title: OpenPort Agent API
  version: 0.1.0
  description: Standardized AI gateway API for web applications.
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /api/agent/v1/manifest:
    get:
      summary: List discoverable tools for the current integration
      parameters:
        - in: query
          name: intentCertificateId
          schema:
            type: string
          description: Optional intent certificate used for monotone manifest narrowing.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessManifest'
  /api/agent/v1/intent:
    post:
      summary: Create an intent certificate for the current integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessIntent'
  /api/agent/v1/ledgers:
    get:
      summary: List accessible ledgers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessLedgers'
  /api/agent/v1/transactions:
    get:
      summary: List transactions
      parameters:
        - in: query
          name: ledgerId
          required: true
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTransactions'
  /api/agent/v1/preflight:
    post:
      summary: Pre-compute impact and return preconditions for execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreflightRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPreflight'
  /api/agent/v1/actions:
    post:
      summary: Create a draft or execute action based on policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessActionResult'
  /api/agent/v1/drafts/{id}:
    get:
      summary: Get draft status and latest execution
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessDraft'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AgentToken
  schemas:
    EnvelopeBase:
      type: object
      properties:
        ok:
          type: boolean
        code:
          type: string
      required: [ok, code]
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            ok:
              const: false
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          required: [message]
    Tool:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        requiredScopes:
          type: array
          items:
            type: string
        risk:
          type: string
          enum: [low, medium, high]
        requiresConfirmation:
          type: boolean
      required: [name, description, requiredScopes, risk, requiresConfirmation]
    SuccessManifest:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            ok:
              const: true
            data:
              type: object
              properties:
                app:
                  type: object
                tools:
                  type: array
                  items:
                    $ref: '#/components/schemas/Tool'
                intentCertificate:
                  $ref: '#/components/schemas/IntentCertificate'
    CreateIntentRequest:
      type: object
      properties:
        request:
          type: string
        intentClasses:
          type: array
          items:
            type: string
            enum: [read, summarize, transform, create, update, delete, export, delegate, admin, unknown]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        resourceBounds:
          type: object
          additionalProperties: true
        effectBounds:
          type: object
          additionalProperties: true
        reviewMode:
          type: string
          enum: [allow, draft, preflight, confirm, deny, clarify]
        classifierSource:
          type: string
        expiresInSeconds:
          type: integer
          minimum: 1
    IntentCertificate:
      type: object
      properties:
        id:
          type: string
        requestHash:
          type: string
        requestExcerpt:
          type: string
          nullable: true
        intentClasses:
          type: array
          items:
            type: string
        resourceBounds:
          type: object
          additionalProperties: true
        effectBounds:
          type: object
          additionalProperties: true
        confidence:
          type: number
        reviewMode:
          type: string
        classifierSource:
          type: string
        auditDigest:
          type: string
        expiresAt:
          type: string
          format: date-time
    SuccessIntent:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            ok:
              const: true
            data:
              type: object
              properties:
                certificate:
                  $ref: '#/components/schemas/IntentCertificate'
    SuccessLedgers:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            ok:
              const: true
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
    SuccessTransactions:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            ok:
              const: true
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                total:
                  type: integer
                page:
                  type: integer
                pageSize:
                  type: integer
                hasMore:
                  type: boolean
    PreflightRequest:
      type: object
      properties:
        action:
          type: string
        payload:
          type: object
          additionalProperties: true
        intentCertificateId:
          type: string
          description: Optional intent certificate used for preflight consistency checks.
      required: [action, payload]
    SuccessPreflight:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            ok:
              const: true
            data:
              type: object
              properties:
                action:
                  type: string
                risk:
                  type: string
                impact:
                  type: object
                  additionalProperties: true
                impactHash:
                  type: string
                  description: Hex-encoded SHA-256 over the RFC 8785 canonical JSON encoding of {action, payload, impact}.
                stateWitness:
                  type: object
                  nullable: true
                  additionalProperties: true
                  description: Optional server-generated state witness snapshot (for State Witness profile).
                stateWitnessHash:
                  type: string
                  nullable: true
                  description: Hex-encoded SHA-256 over the RFC 8785 canonical JSON encoding of stateWitness (execute-time precondition under the State Witness profile).
                preflightId:
                  type: string
    CreateActionRequest:
      type: object
      properties:
        action:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: Payload for the action. Required unless preflightId is provided.
        preflightId:
          type: string
          description: Preflight handle returned by POST /preflight. When provided, the server MAY reuse the cached payload and preflight hash.
        execute:
          type: boolean
        forceDraft:
          type: boolean
        requestId:
          type: string
        idempotencyKey:
          type: string
        justification:
          type: string
        preflightHash:
          type: string
          description: Preflight impact hash returned by POST /preflight (SHA-256 over RFC 8785 canonical JSON of {action, payload, impact}).
        stateWitnessHash:
          type: string
          description: Optional execute-time state precondition hash (SHA-256 over RFC 8785 canonical JSON of stateWitness; typically returned by POST /preflight).
        intentCertificateId:
          type: string
          description: Optional intent certificate used for action consistency checks and audit binding.
      required: [action]
    SuccessActionResult:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            ok:
              const: true
            data:
              type: object
              additionalProperties: true
    SuccessDraft:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            ok:
              const: true
            data:
              type: object
              additionalProperties: true
